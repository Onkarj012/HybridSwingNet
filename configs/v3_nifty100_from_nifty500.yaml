run:
  name: v3_nifty100_from_nifty500
  out_dir: runs
  seed: 42
  device: mps
splits:
  split_mode: cross_sectional
  train_end: '2023-06-30'
  val_end: '2024-03-31'
  test_end: '2024-12-31'
  val_stocks: 10
  test_stocks: 10
  blind_holdout_stocks: 10
  embargo_days: 10
features:
  horizons:
  - 1
  - 3
  - 5
  - 7
  - 10
  windows:
    short: 7
    mid: 21
    long: 60
  short_features:
  - log_return
  - volume_change
  - rsi_6
  - volatility_7
  - bb_zscore
  - rsi_delta
  - obv_divergence
  - price_vs_vwap
  mid_features:
  - rsi_14
  - macd
  - macd_signal
  - macd_hist
  - bb_width
  - sma_20_z
  - volatility_21
  - macd_momentum
  - zscore_velocity
  - mfi_14
  - stoch_k
  - chaikin_osc
  long_features:
  - adx
  - sma_50_z
  - volatility_60
  - trend_strength
  - regime_sma
  - vol_acceleration
  - sma_100_z
  - atr_14
  context_features:
  - bb_zscore
  - rsi_14
  - trend_strength
  - regime_sma
  - volatility_21
  - vol_expansion
  - pv_divergence
  - sentiment_mean
  - sentiment_momentum
  - sentiment_rolling_5d
  - rsi_delta
  - macd_momentum
  - fib_distance_to_nearest
  - fib_relative_position
  - fib_zone
  - natr
  - williams_r
  - cci
  - macro_proxy
  - market_return_1d
  - market_return_5d
  - market_vol_21d
  - market_trend_60d
  - market_breadth_5d
model:
  type: stockxpert_v3
  use_stock_traits: true
  use_macro_features: false
  stock_traits_dim: 7
  hidden_dim: 96
  stock_embed_dim: 16
  attn_heads: 4
  dropout: 0.15
loss_weights:
  legacy_loss_mode: false
  direction: 1.0
  magnitude: 0.4
  regime: 0.0
train:
  use_amp: true
  epochs: 50
  batch_size: 256
  lr: 0.00015
  weight_decay: 0.003
  early_stopping_patience: 4
  horizon_weights:
  - 1.2
  - 1.0
  - 0.9
  - 0.7
  - 0.5
calibration:
  method: isotonic
  calibrate_on_val: true
backtest:
  sector_cap_pct: 0.3
  drawdown_pause_pct: 0.15
  max_adv_pct: 0.05
live:
  paper_trading_threshold: 0.6
  accuracy_floor: 0.52
  psi_threshold: 0.2
  ece_drift_threshold: 0.05
