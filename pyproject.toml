[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockxpert"
version = "0.1.0"
description = "Research codebase for multi-horizon stock forecasting, signal generation, and backtesting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pytz>=2024.1",
    "requests>=2.28.0",
    "rich>=13.7.0",
    "scikit-learn>=1.2.0",
    "seaborn>=0.12.0",
    "sentencepiece>=0.1.99",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "transformers>=4.30.0",
    "yfinance>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
backend = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["stockxpert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
